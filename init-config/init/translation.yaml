framework:
    default_locale: '%env(APP_LOCALE)%'
    translator:
        default_path: '%kernel.project_dir%/translations'
        providers:
            crudit:
                dsn: '%env(CRUDIT_TRANSLATION_DSN)%'
                domains: ['messages', 'validators']
                locales: '%locales%'
        fallbacks:
            - '%env(APP_LOCALE)%'
