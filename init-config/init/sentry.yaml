when@prod:
    sentry:
        dsn: '%env(SENTRY_DSN)%'
        options:
            environment: '%kernel.environment%'
            release: '%env(APP_VERSION)%'
            ignore_exceptions:
                - 'Symfony\Component\HttpKernel\Exception\NotFoundHttpException'
                - 'Symfony\Component\HttpKernel\Exception\BadRequestHttpException'
                - 'Symfony\Component\HttpKernel\Exception\AccessDeniedHttpException'
                - 'Symfony\Component\Security\Core\Exception\AccessDeniedException'
                - 'Symfony\Component\HttpKernel\Exception\NotAcceptableHttpException'
        # If you are using Monolog, you also need this additional configuration to log the errors correctly:
        # https://docs.sentry.io/platforms/php/guides/symfony/integrations/monolog/
        register_error_listener: false
        register_error_handler: false

    # Enable one of the two services below, depending on your choice above
    services:
        Sentry\Monolog\BreadcrumbHandler:
            arguments:
                - '@Sentry\State\HubInterface'
                - !php/const Monolog\Logger::INFO

        Sentry\Monolog\Handler:
            arguments:
                $hub: '@Sentry\State\HubInterface'
                $level: !php/const Monolog\Logger::ERROR
                $fillExtraContext: true # Enables sending monolog context to Sentry

    monolog:
        handlers:
            sentry_breadcrumbs:
                type: service
                name: sentry_breadcrumbs
                id: Sentry\Monolog\BreadcrumbHandler
            sentry:
                type: service
                id: Sentry\Monolog\Handler
