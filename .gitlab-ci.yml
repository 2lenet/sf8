stages:
    - test
    - analysis
    - build
    - deploy

variables:
    DOCKER_BUILDKIT: '1'
    MYSQL_DATABASE: [PROJECT]
    MYSQL_ROOT_PASSWORD: pass
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

include:
    - project: '2le/devops'
      ref: master # Git branch
      file: '/gitlab-ci/symfony-check.yml'

build-npm:
    image: registry.2le.net/2le/2le:base-sf8-xdebug
    stage: test
    cache:
        - key:
              prefix: build-npm
              files:
                  - composer.lock
          paths:
              - vendor/
        - key:
              files:
                  - package-lock.json
          paths:
              - .npm/
        - key:
              files:
                  - composer.lock
                  - package-lock.json
          paths:
              - public/build/crudit/
    script:
        - composer install --no-dev --no-scripts
        - npm ci --cache .npm --prefer-offline
        - npm run build
    artifacts:
        paths:
            - public/build/
        expire_in: 1 week
    rules:
        - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "devops"
          changes:
              - "assets/**/*"
              - "package-lock.json"
              - "composer.lock"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
              - "assets/**/*"
              - "package-lock.json"
              - "composer.lock"

unittest:
    image: registry.2le.net/2le/2le:base-sf8-xdebug
    stage: test
    needs:
        - job: build-npm
          optional: true
          artifacts: true
    services:
        - name: registry.2le.net/2le/[PROJECT]:db
          alias: db
        - name: registry.2le.net/2le/[PROJECT]:dbtest
          alias: dbtest
    cache:
        - key:
              files:
                  - composer.lock
          paths:
              - vendor/
        - key:
              files:
                  - package-lock.json
          paths:
              - .npm/
        - key:
              files:
                  - composer.lock
                  - package-lock.json
          paths:
              - public/build/crudit/
    script:
        - composer install
        - |
            if [ ! -f "public/build/crudit/entrypoints.json" ]; then
              npm ci --cache .npm --prefer-offline && npm run build
            fi
        - make test
    artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage-cobertura.xml
        paths:
            - phpunit-coverage.xml
            - phpunit-report.xml
            - coverage-cobertura.xml
    only:
        - main
        - merge_requests
        - devops

sonarqube:
    stage: analysis
    image: sonarsource/sonar-scanner-cli
    variables:
        SONAR_URL: https://sonar.2le.net
        SONAR_ANALYSIS_MODE: publish
    script:
        - sonar-scanner
    only:
        - main
        - merge_requests
        - devops

hal:
    image: registry.2le.net/2le/2le:base-sf8
    stage: build
    only:
        - tags
    script:
        - curl --location --request POST "https://hal.2le-test.me/api/upload/composer/[PROJECT]" --form composerJson=@composer.json --form composerLock=@composer.lock
        - curl --location --request POST "https://hal.2le-test.me/api/upload/package/[PROJECT]" --header "Content-Type:application/json" --data-binary @package.json
        - curl --location --request POST "https://hal.2le-test.me/api/upload/phpstan/[PROJECT]" --data-binary @phpstan.neon

build-main:
    image: registry.2le.net/2le/2le:base-build
    stage: build
    needs:
        - job: symfony-check
        - job: unittest
    script:
        - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
        - docker pull $CI_REGISTRY_IMAGE:latest || true
        - >-
            docker build
            --cache-from $CI_REGISTRY_IMAGE:latest
            --build-arg BUILDKIT_INLINE_CACHE=1
            --build-arg app_version=dev-$CI_PIPELINE_ID
            -t $CI_REGISTRY_IMAGE:latest .
        - docker push $CI_REGISTRY_IMAGE:latest
    only:
        - main

deploy-main:
    image: registry.2le.net/2le/2le:base-deploy
    stage: deploy
    variables:
        GIT_STRATEGY: none
    only:
        - main
    script:
        - ssh -o StrictHostKeyChecking=no root@cluster.2le.net "cd /data/docker/[PROJECT]-test/; up-stack $CI_REGISTRY_IMAGE:latest symfony "

build-tags:
    stage: build
    image: registry.2le.net/2le/2le:base-build
    script:
        - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
        - docker build -t $IMAGE_TAG --build-arg app_version=$CI_COMMIT_TAG .
        - docker push $IMAGE_TAG
    only:
        - tags

deploy-tags:
    image: registry.2le.net/2le/2le:base-deploy
    stage: deploy
    variables:
        GIT_STRATEGY: none
    only:
        - tags
    script:
        - ssh -o StrictHostKeyChecking=no root@cluster.2le.net "cd /data/docker/[PROJECT]/; up-stack $IMAGE_TAG symfony "
