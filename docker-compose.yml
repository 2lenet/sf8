services:
    dbtest:
        image: mariadb:lts
        environment:
            MARIADB_ROOT_PASSWORD: pass
            MARIADB_DATABASE: [PROJECT]

    symfony:
        build: .
        entrypoint: "/entrypoint_dev.sh"
        command: "frankenphp run --config /etc/caddy/Caddyfile.dev"
        working_dir: /app
        ports:
            - "8[IDENTIFIER]:80"
        environment:
            - "COMPOSER_MEMORY_LIMIT=-1"
        depends_on:
            - db
            - dbtest
        volumes:
            - ./:/app/
            - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini

    pma:
        image: phpmyadmin/phpmyadmin
        links:
            - db:db
        ports:
            - "9[IDENTIFIER]:80"
        environment:
            UPLOAD_LIMIT: 3000000000
            PMA_HOST: db
        depends_on:
            - db
        volumes:
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php-phpmyadmin.ini

    smtp:
        image: mailhog/mailhog
        ports:
            - "10[IDENTIFIER]:8025"
